<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BirdEar — Indian Bird Sound Identifier</title>
<style>
  :root { --bg:#0f1117; --card:#1e2130; --accent:#4f9cf9; --text:#ffffff; --text-dim:#9aa1b1; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; padding:48px 16px 80px; }
  .container { width:100%; max-width:600px; }
  header { text-align:center; margin-bottom:40px; }
  header h1 { font-size:40px; font-weight:800; margin:0; letter-spacing:-0.5px; }
  header p { color:var(--text-dim); margin:8px 0 0; font-size:15px; }
  .card { background:var(--card); border-radius:16px; padding:24px; }
  #upload-zone { border:2px dashed #3a3f52; border-radius:16px; background:var(--card);
    padding:48px 24px; text-align:center; cursor:pointer; transition:border-color 0.15s; }
  #upload-zone:hover, #upload-zone.drag-over { border-color:var(--accent); }
  #upload-zone svg { width:40px; height:40px; stroke:var(--text-dim); margin-bottom:12px; }
  #upload-zone p { margin:0; color:var(--text-dim); font-size:15px; }
  #file-input { display:none; }
  #record-btn { width:100%; margin-top:16px; padding:14px; border-radius:12px;
    border:1px solid #3a3f52; background:transparent; color:var(--text); font-size:15px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:border-color 0.15s; }
  #record-btn:hover { border-color:var(--accent); }
  .rec-dot { width:10px; height:10px; border-radius:50%; background:#f95555;
    display:none; animation:pulse 1s infinite; }
  #record-btn.recording .rec-dot { display:inline-block; }
  #record-timer { font-size:13px; color:var(--text-dim); display:none; }
  @keyframes pulse { 0%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.75)} 100%{opacity:1;transform:scale(1)} }
  #file-info { margin-top:20px; text-align:center; display:none; }
  #file-info .name { font-size:15px; }
  #file-info .duration { color:var(--text-dim); font-size:13px; margin-top:4px; }
  #identify-btn { width:100%; margin-top:16px; padding:14px; border-radius:12px;
    border:none; background:var(--accent); color:#fff; font-size:16px; font-weight:600;
    cursor:pointer; display:none; }
  #identify-btn:disabled { opacity:0.6; cursor:not-allowed; }
  #spinner-wrap { display:none; justify-content:center; padding:40px 0; flex-direction:column; align-items:center; gap:16px; }
  .spinner { width:40px; height:40px; border:4px solid #3a3f52; border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite; }
  #spinner-wrap p { color:var(--text-dim); font-size:14px; margin:0; }
  @keyframes spin { to{transform:rotate(360deg)} }
  #error-box { display:none; margin-top:16px; padding:14px; border-radius:12px;
    background:rgba(249,85,85,0.12); color:#f97070; font-size:14px; text-align:center; }
  #results { display:none; margin-top:24px; }
  .results-header { margin-bottom:20px; }
  .results-header h2 { font-size:20px; font-weight:700; margin:0 0 4px; }
  .results-header p { color:var(--text-dim); font-size:14px; margin:0; }
  .species-card { background:var(--card); border-radius:12px; padding:16px 20px;
    margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .species-card .left .name { font-size:16px; font-weight:600; }
  .species-card .left .detections { color:var(--text-dim); font-size:13px; margin-top:3px; }
  .species-card .right { text-align:right; }
  .species-card .right .conf { font-size:18px; font-weight:700; color:var(--accent); }
  .species-card .right .label { color:var(--text-dim); font-size:11px; margin-top:2px; }
  .badge-1 { border-left:3px solid #f9d44f; }
  .badge-2 { border-left:3px solid #9aa1b1; }
  .badge-3 { border-left:3px solid #c87941; }
  #retry-btn { width:100%; margin-top:16px; padding:14px; border-radius:12px;
    border:1px solid #3a3f52; background:transparent; color:var(--text); font-size:15px; cursor:pointer; }
  #retry-btn:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>BirdEar</h1>
    <p>Indian Bird Sound Identifier — 93 species</p>
  </header>

  <div id="upload-state">
    <div id="upload-zone">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <p>Drop an audio file or click to upload<br><span style="font-size:12px;">.wav or .mp3, up to 100 MB</span></p>
    </div>
    <input type="file" id="file-input" accept=".wav,.mp3,audio/wav,audio/mpeg" />

    <button id="record-btn">
      <span class="rec-dot"></span>
      <span id="record-label">Record</span>
      <span id="record-timer"></span>
    </button>

    <div id="file-info">
      <div class="name" id="file-name"></div>
      <div class="duration" id="file-duration"></div>
    </div>

    <button id="identify-btn">Identify Birds</button>
    <div id="spinner-wrap"><div class="spinner"></div><p id="spinner-msg">Analysing audio…</p></div>
    <div id="error-box"></div>
  </div>

  <div id="results">
    <div class="results-header">
      <h2 id="results-title"></h2>
      <p id="results-subtitle"></p>
    </div>
    <div id="species-list"></div>
    <button id="retry-btn">Try another</button>
  </div>
</div>

<script>
  const uploadZone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');
  const recordBtn = document.getElementById('record-btn');
  const recordLabel = document.getElementById('record-label');
  const recordTimer = document.getElementById('record-timer');
  const fileInfo = document.getElementById('file-info');
  const fileNameEl = document.getElementById('file-name');
  const fileDurationEl = document.getElementById('file-duration');
  const identifyBtn = document.getElementById('identify-btn');
  const spinnerWrap = document.getElementById('spinner-wrap');
  const spinnerMsg = document.getElementById('spinner-msg');
  const errorBox = document.getElementById('error-box');
  const uploadState = document.getElementById('upload-state');
  const resultsEl = document.getElementById('results');
  const retryBtn = document.getElementById('retry-btn');

  let selectedFile = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let timerInterval = null;
  let recordSeconds = 0;

  function resetToUpload() {
    selectedFile = null;
    fileInput.value = '';
    fileInfo.style.display = 'none';
    identifyBtn.style.display = 'none';
    identifyBtn.disabled = false;
    spinnerWrap.style.display = 'none';
    errorBox.style.display = 'none';
    resultsEl.style.display = 'none';
    uploadState.style.display = 'block';
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    spinnerWrap.style.display = 'none';
    identifyBtn.disabled = false;
  }

  function getAudioDuration(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const audio = new Audio();
      audio.preload = 'metadata';
      audio.onloadedmetadata = () => { resolve(isFinite(audio.duration) ? audio.duration : 0); URL.revokeObjectURL(url); };
      audio.onerror = () => resolve(0);
      audio.src = url;
    });
  }

  async function setSelectedFile(file) {
    selectedFile = file;
    const duration = await getAudioDuration(file);
    fileNameEl.textContent = file.name;
    fileDurationEl.textContent = duration ? `${duration.toFixed(1)}s` : '';
    fileInfo.style.display = 'block';
    identifyBtn.style.display = 'block';
    errorBox.style.display = 'none';
  }

  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('drag-over'); const f = e.dataTransfer.files[0]; if (f) setSelectedFile(f); });
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) setSelectedFile(f); });

  recordBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        recordSeconds = 0;
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(timerInterval);
          recordTimer.style.display = 'none';
          const blob = new Blob(recordedChunks, { type: 'audio/wav' });
          const file = new File([blob], 'recording.wav', { type: 'audio/wav' });
          await setSelectedFile(file);
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recordLabel.textContent = 'Stop recording';
        recordTimer.style.display = 'inline';
        timerInterval = setInterval(() => {
          recordSeconds++;
          const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
          const s = String(recordSeconds % 60).padStart(2, '0');
          recordTimer.textContent = `${m}:${s}`;
        }, 1000);
      } catch (err) { showError('Microphone access denied'); }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordLabel.textContent = 'Record';
    }
  });

  function renderResults(data) {
    const title = document.getElementById('results-title');
    const subtitle = document.getElementById('results-subtitle');
    const list = document.getElementById('species-list');

    if (data.species_found === 0) {
      title.textContent = 'No birds detected';
      subtitle.textContent = `Analysed ${data.total_segments} segments — try a longer or cleaner recording`;
      list.innerHTML = '';
    } else {
      title.textContent = `${data.species_found} species detected`;
      subtitle.textContent = `Across ${data.total_segments} audio segments`;
      list.innerHTML = '';
      data.detections.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'species-card' + (i === 0 ? ' badge-1' : i === 1 ? ' badge-2' : i === 2 ? ' badge-3' : '');
        card.innerHTML = `
          <div class="left">
            <div class="name">${d.species}</div>
            <div class="detections">detected in ${d.detections} segment${d.detections > 1 ? 's' : ''}</div>
          </div>
          <div class="right">
            <div class="conf">${Math.round(d.confidence * 100)}%</div>
            <div class="label">avg confidence</div>
          </div>`;
        list.appendChild(card);
      });
    }

    uploadState.style.display = 'none';
    resultsEl.style.display = 'block';
  }

  identifyBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    errorBox.style.display = 'none';
    identifyBtn.disabled = true;
    spinnerMsg.textContent = 'Analysing audio…';
    spinnerWrap.style.display = 'flex';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();
      spinnerWrap.style.display = 'none';
      if (!res.ok) { showError(data.error || 'Could not process audio'); return; }
      renderResults(data);
    } catch (err) { showError('Could not process audio'); }
  });

  retryBtn.addEventListener('click', resetToUpload);
</script>
</body>
</html>
