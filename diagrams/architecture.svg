<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9cf9"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6172"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0f1117"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">BirdEar — Inference Architecture</text>
  <text x="500" y="66" text-anchor="middle" fill="#9aa1b1" font-size="13">One uploaded clip, two model stages, one JSON response</text>

  <!-- Client -->
  <rect x="40" y="110" width="180" height="90" rx="14" fill="#1e2130" stroke="#3a3f52" stroke-width="1.5"/>
  <text x="130" y="145" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Browser</text>
  <text x="130" y="166" text-anchor="middle" fill="#9aa1b1" font-size="12">index.html</text>
  <text x="130" y="184" text-anchor="middle" fill="#9aa1b1" font-size="12">upload / record .wav, .mp3</text>

  <!-- FastAPI -->
  <rect x="300" y="110" width="200" height="90" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="400" y="140" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">FastAPI</text>
  <text x="400" y="161" text-anchor="middle" fill="#9aa1b1" font-size="12">POST /predict</text>
  <text x="400" y="180" text-anchor="middle" fill="#9aa1b1" font-size="12">main.py</text>

  <path d="M220 155 H300" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="147" text-anchor="middle" fill="#5b6172" font-size="11">multipart file</text>

  <!-- scratch file -->
  <rect x="580" y="110" width="200" height="90" rx="14" fill="#161925" stroke="#3a3f52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="680" y="140" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Scratch file</text>
  <text x="680" y="161" text-anchor="middle" fill="#9aa1b1" font-size="12">tempfile.NamedTemp-</text>
  <text x="680" y="178" text-anchor="middle" fill="#9aa1b1" font-size="12">File(delete=True)</text>

  <path d="M500 155 H580" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="147" text-anchor="middle" fill="#5b6172" font-size="11">write bytes</text>

  <!-- Stage 1: BirdNET -->
  <rect x="300" y="270" width="230" height="120" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="415" y="298" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Stage 1 · Feature extractor</text>
  <text x="415" y="322" text-anchor="middle" fill="#4f9cf9" font-size="13" font-weight="600">BirdNET (birdnetlib)</text>
  <text x="415" y="343" text-anchor="middle" fill="#9aa1b1" font-size="12">pretrained TFLite model</text>
  <text x="415" y="361" text-anchor="middle" fill="#9aa1b1" font-size="12">loaded once at startup</text>

  <path d="M680 200 V240 Q680 260 660 260 H460 Q440 260 440 270" fill="none" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="253" text-anchor="middle" fill="#5b6172" font-size="11">extract_embeddings()</text>

  <!-- embeddings vector -->
  <rect x="600" y="290" width="150" height="80" rx="12" fill="#161925" stroke="#3a3f52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="675" y="318" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Embedding(s)</text>
  <text x="675" y="338" text-anchor="middle" fill="#9aa1b1" font-size="12">1024-dim vector</text>
  <text x="675" y="355" text-anchor="middle" fill="#9aa1b1" font-size="12">per ~3s segment</text>

  <path d="M530 330 H600" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: ONNX head -->
  <rect x="300" y="430" width="230" height="110" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="415" y="458" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Stage 2 · Classifier head</text>
  <text x="415" y="482" text-anchor="middle" fill="#4f9cf9" font-size="13" font-weight="600">bird_classifier.onnx</text>
  <text x="415" y="503" text-anchor="middle" fill="#9aa1b1" font-size="12">small MLP, ONNX Runtime</text>
  <text x="415" y="521" text-anchor="middle" fill="#9aa1b1" font-size="12">1024 → 256 → 48 classes</text>

  <path d="M675 370 V410 Q675 430 655 430 H460 Q440 430 440 430" fill="none" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- softmax + avg -->
  <rect x="600" y="445" width="160" height="80" rx="12" fill="#161925" stroke="#3a3f52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="680" y="470" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">softmax + average</text>
  <text x="680" y="490" text-anchor="middle" fill="#9aa1b1" font-size="12">across all segments</text>
  <text x="680" y="507" text-anchor="middle" fill="#9aa1b1" font-size="12">→ top-5 species</text>

  <path d="M530 485 H600" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- classes json -->
  <rect x="800" y="445" width="160" height="80" rx="12" fill="#161925" stroke="#3a3f52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="880" y="470" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">classes.json</text>
  <text x="880" y="490" text-anchor="middle" fill="#9aa1b1" font-size="12">index → species</text>
  <text x="880" y="507" text-anchor="middle" fill="#9aa1b1" font-size="12">name lookup</text>

  <path d="M800 485 H760" stroke="#5b6172" stroke-width="2" marker-end="url(#arrowDim)"/>

  <!-- back to client -->
  <path d="M415 430 V200" fill="none" stroke="#4f9cf9" stroke-width="0" opacity="0"/>
  <path d="M300 485 H130 V200" fill="none" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="330" text-anchor="middle" fill="#5b6172" font-size="11" transform="rotate(-90 175 330)">JSON: top-5 predictions + confidence</text>

  <!-- legend -->
  <rect x="40" y="560" width="14" height="14" rx="3" fill="#1e2130" stroke="#4f9cf9"/>
  <text x="62" y="571" fill="#9aa1b1" font-size="12">model / logic stage</text>
  <rect x="220" y="560" width="14" height="14" rx="3" fill="#161925" stroke="#3a3f52" stroke-dasharray="3 3"/>
  <text x="242" y="571" fill="#9aa1b1" font-size="12">intermediate data / artifact</text>
</svg>
