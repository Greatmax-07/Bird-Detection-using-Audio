<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9cf9"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9b04f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#0f1117"/>
  <text x="550" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">From Imbalanced Dataset to Deployed Model</text>
  <text x="550" y="66" text-anchor="middle" fill="#9aa1b1" font-size="13">iBC53 (48 species, long-tailed) → BirdNET embeddings → focal-loss MLP → ONNX</text>

  <!-- Row 1: raw dataset -->
  <rect x="60" y="110" width="260" height="90" rx="14" fill="#1e2130" stroke="#3a3f52" stroke-width="1.5"/>
  <text x="190" y="140" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Raw iBC53</text>
  <text x="190" y="160" text-anchor="middle" fill="#9aa1b1" font-size="12">scientific-name folders</text>
  <text x="190" y="178" text-anchor="middle" fill="#9aa1b1" font-size="12">51 dirs, mixed quality</text>

  <path d="M320 155 H400" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="147" text-anchor="middle" fill="#5b6172" font-size="10">00_prepare_ibc53.py</text>

  <rect x="400" y="110" width="260" height="90" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="530" y="135" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Label repair</text>
  <text x="530" y="156" text-anchor="middle" fill="#9aa1b1" font-size="12">sci-name → common-name</text>
  <text x="530" y="174" text-anchor="middle" fill="#9aa1b1" font-size="12">drop 3, dedupe, fix 1 mislabeled class</text>

  <path d="M660 155 H740" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="740" y="110" width="300" height="90" rx="14" fill="#1e2130" stroke="#3a3f52" stroke-width="1.5"/>
  <text x="890" y="135" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">ibc53/ (clean)</text>
  <text x="890" y="156" text-anchor="middle" fill="#9aa1b1" font-size="12">48 species, common-name dirs</text>
  <text x="890" y="174" text-anchor="middle" fill="#9aa1b1" font-size="12">still long-tailed: 8 – 1300+ clips</text>

  <!-- down arrow to augmentation -->
  <path d="M890 200 V240" stroke="#f9b04f" stroke-width="2" marker-end="url(#aOrange)"/>

  <!-- Row 2: augmentation -->
  <rect x="620" y="255" width="420" height="110" rx="14" fill="#1e2130" stroke="#f9b04f" stroke-width="1.5"/>
  <text x="830" y="283" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Weak-tier augmentation</text>
  <text x="830" y="306" text-anchor="middle" fill="#f9b04f" font-size="12" font-weight="600">01_download_weak_species.py</text>
  <text x="830" y="326" text-anchor="middle" fill="#9aa1b1" font-size="12">Xeno-canto API v3 · India first,</text>
  <text x="830" y="344" text-anchor="middle" fill="#9aa1b1" font-size="12">falls back to Bangladesh / Nepal / Myanmar / etc.</text>

  <path d="M620 310 H460" stroke="#f9b04f" stroke-width="2" marker-end="url(#aOrange)"/>

  <rect x="200" y="255" width="260" height="110" rx="14" fill="#1e2130" stroke="#f9b04f" stroke-width="1.5"/>
  <text x="330" y="285" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">xc_downloads/</text>
  <text x="330" y="308" text-anchor="middle" fill="#9aa1b1" font-size="12">21 under-represented species</text>
  <text x="330" y="327" text-anchor="middle" fill="#9aa1b1" font-size="12">topped up with fresh recordings</text>
  <text x="330" y="346" text-anchor="middle" fill="#9aa1b1" font-size="12">+ per-species metadata.csv</text>

  <!-- merge point -->
  <path d="M330 365 V400 H890 V400" fill="none" stroke="#4f9cf9" stroke-width="2"/>
  <path d="M890 365 V400" stroke="#4f9cf9" stroke-width="2"/>
  <path d="M610 400 V440" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="422" text-anchor="middle" fill="#5b6172" font-size="10">02_extract_birdnet_embeddings.py</text>

  <!-- Row 3: embeddings -->
  <rect x="380" y="455" width="460" height="110" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="610" y="483" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">BirdNET embedding extraction</text>
  <text x="610" y="505" text-anchor="middle" fill="#4f9cf9" font-size="12" font-weight="600">frozen pretrained backbone (birdnetlib)</text>
  <text x="610" y="525" text-anchor="middle" fill="#9aa1b1" font-size="12">ibc53/ + xc_downloads/ → 1024-dim vectors</text>
  <text x="610" y="544" text-anchor="middle" fill="#9aa1b1" font-size="12">11,809 embeddings across 48 classes</text>

  <path d="M610 565 V605" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="595" text-anchor="middle" fill="#5b6172" font-size="10" transform="translate(0,-8)"></text>

  <!-- Row 4: features -->
  <rect x="440" y="618" width="340" height="80" rx="14" fill="#161925" stroke="#3a3f52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="610" y="646" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">features/</text>
  <text x="610" y="666" text-anchor="middle" fill="#9aa1b1" font-size="12">X.npy · y.npy · label_map.json · manifest.csv</text>
  <text x="610" y="684" text-anchor="middle" fill="#9aa1b1" font-size="12">stratified 80 / 20 split</text>

  <path d="M610 698 V735" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="725" text-anchor="middle" fill="#5b6172" font-size="10">03_train_classifier_head.py</text>

  <!-- Row 5: training -->
  <rect x="380" y="748" width="460" height="100" rx="14" fill="#1e2130" stroke="#4f9cf9" stroke-width="1.5"/>
  <text x="610" y="775" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Classifier head training</text>
  <text x="610" y="797" text-anchor="middle" fill="#4f9cf9" font-size="12" font-weight="600">small MLP · focal loss · inverse-freq class weights</text>
  <text x="610" y="816" text-anchor="middle" fill="#9aa1b1" font-size="12">→ classifier_head_best.pt · 0.96 macro F1</text>

  <path d="M610 848 V878" stroke="#4f9cf9" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row 6: export -->
  <rect x="380" y="870" width="0" height="0"/>

  <!-- side note box: results -->
  <rect x="60" y="618" width="330" height="180" rx="14" fill="#161925" stroke="#3a3f52" stroke-width="1.5"/>
  <text x="225" y="646" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Before → after (weak tier)</text>
  <text x="90" y="672" fill="#9aa1b1" font-size="12">Black-bellied Plover</text>
  <text x="380" y="672" text-anchor="end" fill="#4f9cf9" font-size="12" font-weight="600">F1 1.00</text>
  <text x="90" y="694" fill="#9aa1b1" font-size="12">Cinnamon Bittern</text>
  <text x="380" y="694" text-anchor="end" fill="#4f9cf9" font-size="12" font-weight="600">F1 1.00</text>
  <text x="90" y="716" fill="#9aa1b1" font-size="12">Chinspot Wren-Babbler</text>
  <text x="380" y="716" text-anchor="end" fill="#4f9cf9" font-size="12" font-weight="600">F1 0.96</text>
  <text x="90" y="738" fill="#9aa1b1" font-size="12">Mrs Gould's Sunbird</text>
  <text x="380" y="738" text-anchor="end" fill="#4f9cf9" font-size="12" font-weight="600">F1 0.94</text>
  <text x="90" y="768" fill="#5b6172" font-size="11">previously: 0 – 18 total training clips</text>
  <text x="90" y="786" fill="#5b6172" font-size="11">all had &lt; 50 estimated 5s chunks</text>

  <!-- final export box far right -->
  <rect x="880" y="618" width="160" height="230" rx="14" fill="#1e2130" stroke="#f9b04f" stroke-width="1.5"/>
  <text x="960" y="646" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Deployed</text>
  <text x="960" y="670" text-anchor="middle" fill="#f9b04f" font-size="11" font-weight="600">04_export_head_onnx.py</text>
  <text x="960" y="696" text-anchor="middle" fill="#9aa1b1" font-size="11">bird_classifier.onnx</text>
  <text x="960" y="714" text-anchor="middle" fill="#9aa1b1" font-size="11">bird_classifier</text>
  <text x="960" y="730" text-anchor="middle" fill="#9aa1b1" font-size="11">.classes.json</text>
  <text x="960" y="756" text-anchor="middle" fill="#9aa1b1" font-size="11">served by</text>
  <text x="960" y="774" text-anchor="middle" fill="#9aa1b1" font-size="11">web/app (FastAPI)</text>
  <text x="960" y="800" text-anchor="middle" fill="#5b6172" font-size="10">see architecture.svg</text>

  <path d="M840 798 H880" stroke="#f9b04f" stroke-width="2" marker-end="url(#aOrange)"/>

  <!-- legend -->
  <rect x="60" y="860" width="14" height="14" rx="3" fill="#1e2130" stroke="#4f9cf9"/>
  <text x="82" y="871" fill="#9aa1b1" font-size="12">pipeline stage</text>
  <rect x="220" y="860" width="14" height="14" rx="3" fill="#1e2130" stroke="#f9b04f"/>
  <text x="242" y="871" fill="#9aa1b1" font-size="12">imbalance-fix step</text>
  <rect x="400" y="860" width="14" height="14" rx="3" fill="#161925" stroke="#3a3f52" stroke-dasharray="3 3"/>
  <text x="422" y="871" fill="#9aa1b1" font-size="12">saved artifact / data</text>
</svg>
